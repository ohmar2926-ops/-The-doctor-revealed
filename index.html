<style>
:root{--bg:#F1EEFF;--ink:#1F1A4D;--mute:#6D68A0;--card:#fff;--line:#E4DFFA;
--coral:#FF6B6B;--coral2:#FF9F6B;--sky:#3DA5FF;--sky2:#7AD0FF;--mint:#22C58B;--mint2:#7CEBB9;--sun:#FFB627;--sun2:#FFE070;--vio:#7B5CFF;--vio2:#B49CFF;--pink:#FF5FA8;--pink2:#FFA0CF}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:440px;min-height:100vh;padding:calc(14px + env(safe-area-inset-top)) 14px calc(90px + env(safe-area-inset-bottom));position:relative}
h1,h2,h3{font-weight:900}
.ico{--a:#7B5CFF;--b:#B49CFF;--s:44px;width:var(--s);height:var(--s);flex:none;border-radius:32%;display:grid;place-items:center;font-size:calc(var(--s)*.52);
background:linear-gradient(150deg,var(--b) 0%,var(--a) 100%);
box-shadow:inset 0 3px 3px rgba(255,255,255,.75),inset 0 -5px 6px rgba(0,0,0,.18),0 5px 0 color-mix(in srgb,var(--a) 60%,#000),0 11px 14px color-mix(in srgb,var(--a) 45%,transparent);
margin-bottom:5px;position:relative}
.ico::after{content:"";position:absolute;top:7%;right:14%;width:34%;height:18%;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-25deg)}
.ico i{font-style:normal;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.c-coral{--a:var(--coral);--b:var(--coral2)}.c-sky{--a:var(--sky);--b:var(--sky2)}.c-mint{--a:var(--mint);--b:var(--mint2)}.c-sun{--a:var(--sun);--b:var(--sun2)}.c-vio{--a:var(--vio);--b:var(--vio2)}.c-pink{--a:var(--pink);--b:var(--pink2)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h1{font-size:26px;flex:1}
.top small{display:block;font-size:12px;color:var(--mute);font-weight:600}
.roles{display:flex;gap:6px;background:#fff;padding:6px;border-radius:22px;box-shadow:0 6px 18px rgba(80,60,200,.12);margin-bottom:16px}
.roles button{flex:1;border:0;background:none;font:inherit;font-weight:800;font-size:13px;color:var(--mute);padding:6px 2px 4px;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.roles button .ico{--s:34px;margin-bottom:3px}
.roles button.on{background:var(--bg);color:var(--ink)}
.card{background:var(--card);border-radius:26px;padding:16px;margin-bottom:14px;box-shadow:0 8px 22px rgba(80,60,200,.10)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.big{font-size:54px;font-weight:900;line-height:1}
.mute{color:var(--mute);font-size:13px;font-weight:600}
.btn{border:0;font:inherit;font-weight:900;font-size:16px;color:#fff;padding:14px 18px;border-radius:20px;cursor:pointer;width:100%;
background:linear-gradient(180deg,var(--vio2),var(--vio));box-shadow:inset 0 2px 2px rgba(255,255,255,.6),0 5px 0 #4B32B8,0 10px 18px rgba(123,92,255,.4);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:inset 0 2px 2px rgba(255,255,255,.6),0 1px 0 #4B32B8}
.btn.mint{background:linear-gradient(180deg,var(--mint2),var(--mint));box-shadow:inset 0 2px 2px rgba(255,255,255,.6),0 5px 0 #0E8A5C,0 10px 18px rgba(34,197,139,.4)}
.btn.coral{background:linear-gradient(180deg,var(--coral2),var(--coral));box-shadow:inset 0 2px 2px rgba(255,255,255,.6),0 5px 0 #C23E3E,0 10px 18px rgba(255,107,107,.4)}
.btn.sm{width:auto;font-size:13px;padding:8px 14px;border-radius:14px}
.btn.ghost{background:var(--bg);color:var(--ink);box-shadow:none}
.chip{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:12px}
.chip.exam{background:#E6F2FF;color:#1C78D4}.chip.follow{background:#E2FAF0;color:#0E8A5C}.chip.paid{background:#E2FAF0;color:#0E8A5C}.chip.unpaid{background:#FFE5E5;color:#C23E3E}
input,select{font:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:2px solid transparent;border-radius:14px;padding:10px 12px;width:100%;outline:0}
input:focus,select:focus{border-color:var(--vio)}
label{font-size:13px;font-weight:800;color:var(--mute);display:block;margin:10px 0 4px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.type{border:3px solid var(--line);background:#fff;border-radius:22px;padding:12px 6px 10px;text-align:center;font:inherit;cursor:pointer;color:var(--ink)}
.type.on{border-color:var(--vio);background:#F6F3FF}
.type .ico{margin:0 auto 6px}
.type b{display:block;font-size:15px}.type span{font-size:20px;font-weight:900;color:var(--vio)}.type small{display:block;font-size:11px;color:var(--mute);font-weight:600}
.ticket{background:linear-gradient(150deg,#7B5CFF,#4B32B8);color:#fff;border-radius:28px;padding:18px;margin-bottom:14px;box-shadow:0 14px 26px rgba(75,50,184,.4);position:relative;overflow:hidden}
.ticket::before,.ticket::after{content:"";position:absolute;width:26px;height:26px;background:var(--bg);border-radius:50%;top:52%}
.ticket::before{right:-13px}.ticket::after{left:-13px}
.ticket .mute{color:#D9D0FF}
.ticket .cut{border-top:3px dashed rgba(255,255,255,.35);margin:14px 6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:rgba(255,255,255,.16);border-radius:18px;padding:10px 12px}
.stat b{font-size:24px;display:block}
.q{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:2px dashed var(--line)}
.q:last-child{border:0}
.num{width:40px;height:40px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-weight:900;font-size:18px;flex:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px}
.tabs button{border:0;font:inherit;font-weight:800;font-size:13px;background:#fff;color:var(--mute);padding:8px 14px;border-radius:16px;white-space:nowrap;cursor:pointer;box-shadow:0 3px 8px rgba(80,60,200,.08)}
.tabs button.on{background:var(--ink);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-weight:700;font-size:13px}
.cal .h{color:var(--mute);font-size:11px;font-weight:800}
.cal .d{padding:7px 0;border-radius:12px}
.cal .d.today{background:var(--ink);color:#fff}
.cal .d.has{background:linear-gradient(150deg,var(--mint2),var(--mint));color:#fff;font-weight:900;box-shadow:0 3px 0 #0E8A5C}
.toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-160%);width:min(400px,92vw);background:var(--ink);color:#fff;border-radius:22px;padding:12px 14px;display:flex;gap:10px;align-items:center;z-index:50;transition:transform .35s cubic-bezier(.2,1.3,.4,1);box-shadow:0 14px 30px rgba(0,0,0,.35)}
.toast.show{transform:translate(-50%,0)}
.toast .ico{--s:38px;margin:0}
.modal{position:fixed;inset:0;background:rgba(31,26,77,.55);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.modal>div{background:#fff;width:100%;max-width:440px;border-radius:30px 30px 0 0;padding:20px 18px 26px}
.field{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;padding:18px 6px;color:var(--mute);font-weight:700}
.empty .ico{margin:0 auto 10px}
.sec{font-size:17px;margin:4px 2px 10px;display:flex;align-items:center;gap:8px;font-weight:900}
.edit{background:var(--bg);border-radius:18px;padding:10px;margin-bottom:10px}
.x{border:0;background:#FFE5E5;color:#C23E3E;border-radius:12px;font:inherit;font-weight:900;padding:6px 10px;cursor:pointer}
.demo{background:#FFF1CC;color:#7A5500;border-radius:16px;padding:8px 12px;font-size:12px;font-weight:700;margin-bottom:12px}
.spin{animation:sp 1s linear infinite;display:inline-block}@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"><div class="ico c-sun"><i>🔔</i></div><div id="tmsg" style="font-weight:700;font-size:14px"></div></div>
<div id="modal" class="modal" style="display:none"></div>

<script>
/* ================= أدوات عامة ================= */
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const todayStr=()=>iso(new Date());
const addDays=k=>{const d=new Date();d.setDate(d.getDate()+k);return iso(d)};
const fmt=s=>new Date(s+'T12:00:00').toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
const n=x=>Number(x).toLocaleString('ar-EG');
const ico=(e,c,s)=>`<div class="ico c-${c}" ${s?`style="--s:${s}px"`:''}><i>${e}</i></div>`;
const pubOf=q=>({inNum:(q.find(x=>x.status==='in')||{}).num??null,waiting:q.filter(x=>x.status==='waiting').map(x=>x.num).sort((a,b)=>a-b)});

/* ================= الحالة ================= */
const CFG=window.DAWRY_CONFIG||{};
const LIVE=!!(CFG.apiKey&&!String(CFG.apiKey).startsWith('PASTE'));
window.__LIVE=LIVE;
let API=null;
const S={
 settings:{clinic:'عيادة د. منى السيد',spec:'باطنة وسكر',examPrice:300,followPrice:150,followDays:14,avgMin:10},
 queue:[],followups:[],pub:{inNum:null,waiting:[]},mine:null,
 auth:{ready:!LIVE,role:null,uid:null,email:''},
 role:'patient',tab:'settings',cal:{y:new Date().getFullYear(),m:new Date().getMonth()},
 myType:'exam',myName:'',loginErr:'',told:{},netErr:false,pending:false
};
const price=t=>t==='exam'?S.settings.examPrice:S.settings.followPrice;
const qPrice=q=>q.price!=null?q.price:price(q.type); // السعر المحفوظ وقت الحجز، وإلا السعر الحالي
const ahead=e=>S.pub.waiting.filter(x=>x<e.num).length+(S.pub.inNum!=null?1:0);
const isStaff=()=>!LIVE||!!S.auth.role;

/* ================= واجهة الـ Toast والتنبيهات ================= */
let tt;
function toast(msg,e){$('#tmsg').textContent=msg;$('.toast .ico i').textContent=e||'🔔';$('#toast').classList.add('show');clearTimeout(tt);tt=setTimeout(()=>$('#toast').classList.remove('show'),4200)}
function push(m,e){
 toast(m,e);
 try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(_){}
 if(document.hidden&&'Notification' in window&&Notification.permission==='granted'&&navigator.serviceWorker){
  navigator.serviceWorker.ready.then(r=>r.showNotification('دوري',{body:m,icon:'icon-192.png',badge:'icon-192.png',vibrate:[200,100,200]}));
 }
}
function notify(){
 const me=S.mine;if(!me)return;
 const T=S.told[me.id]=S.told[me.id]||{};
 if(me.status==='in'){if(!T.in){T.in=1;push('دورك الآن! ادخل العيادة','🚪')}return}
 if(me.status!=='waiting')return;
 const a=ahead(me);
 if(a===0&&!T.c){T.c=T.b=T.a=1;push('أنت التالي! جهّز نفسك','⏰')}
 else if(a===1&&!T.b){T.b=T.a=1;push('دورك قرّب! فاضل دور واحد قبلك','⏰')}
 else if(a<=3&&a>1&&!T.a){T.a=1;push('استعد، أمامك '+n(a)+' أدوار فقط','🔔')}
}
function modal(html){const m=$('#modal');m.innerHTML='<div>'+html+'</div>';m.style.display='flex';m.onclick=e=>{if(e.target===m)closeModal()}}
function closeModal(){$('#modal').style.display='none'}

/* ================= الإجراءات ================= */
function setRole(r){S.role=r;S.loginErr='';render()}
function pickType(t){S.myType=t;render()}
function mineCb(doc){
 if(doc&&(doc.status==='cancelled'||doc.day!==todayStr())){doc=null;localStorage.removeItem('dawry_my')}
 if(doc&&doc.status==='done'&&doc.type==='exam')localStorage.setItem('dawry_last',JSON.stringify({date:doc.day}));
 if(doc&&doc.followDate)localStorage.setItem('dawry_follow',JSON.stringify({date:doc.followDate,price:doc.followPrice}));
 S.mine=doc;notify();soft();
}
function lastExam(){try{return JSON.parse(localStorage.getItem('dawry_last')||'null')}catch(_){return null}}
function followOk(){
 const l=lastExam();if(!l)return false;
 const d=(new Date(todayStr()+'T12:00:00')-new Date(l.date+'T12:00:00'))/864e5;
 return d<=S.settings.followDays;
}
async function book(){
 const name=(S.myName||'').trim();if(!name){toast('اكتب اسمك الأول','✏️');return}
 if(S.myType==='follow'&&!followOk()){toast('الإعادة متاحة خلال '+n(S.settings.followDays)+' يوم من آخر كشف لك هنا. اختر كشف جديد أو كلّم العيادة','⚠️');return}
 if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
 try{
  const id=await API.book(name,S.myType,S.auth.uid,price(S.myType));
  localStorage.setItem('dawry_my',id);API.watchMine(id,mineCb);
  toast('تم الحجز بنجاح','🎟️');
 }catch(e){console.error(e);toast('تعذّر الحجز. تأكد من الاتصال بالإنترنت','⚠️')}
}
function cancelMe(){if(S.mine){API.cancelMine(S.mine.id);localStorage.removeItem('dawry_my')}}
function newBooking(){localStorage.removeItem('dawry_my');API.watchMine(null,mineCb)}
async function addWalkin(){
 const name=($('#wn').value||'').trim();if(!name){toast('اكتب اسم المريض','✏️');return}
 const type=$('#wt').value;
 if(type==='follow'&&!S.followups.some(f=>f.name.trim()===name)){
  S.walk={name};
  modal(`<div class="row" style="margin-bottom:10px">${ico('🔁','sun',50)}<div class="grow"><h3>تأكيد الإعادة</h3><div class="mute">لا يوجد سجل متابعة باسم «${esc(name)}». الإعادة صالحة خلال ${n(S.settings.followDays)} يوم من الكشف.</div></div></div>
  <button class="btn mint" onclick="doWalk('follow')">نعم، ضمن فترة الإعادة</button><div style="height:12px"></div>
  <button class="btn" onclick="doWalk('exam')">أضفه ككشف جديد</button><div style="height:12px"></div>
  <button class="btn ghost" onclick="closeModal()">إلغاء</button>`);
  return;
 }
 await doWalk(type,name);
}
async function doWalk(type,name){
 name=name||(S.walk&&S.walk.name);closeModal();if(!name)return;
 try{await API.addWalk(name,type,S.auth.uid,price(type));const w=$('#wn');if(w)w.value=''}catch(e){toast('تعذّرت الإضافة','⚠️')}
}
function togglePaid(id){const q=S.queue.find(x=>x.id===id);API.upd(id,{paid:!q.paid})}
function removeQ(id){API.upd(id,{status:'cancelled'})}
function delQ(id){S.followups.filter(f=>f.qid===id).forEach(f=>API.delFollow(f.id));API.del(id)}
function next(){const cur=S.queue.find(q=>q.status==='in');cur?askFollow(cur.id):advance()}
function advance(){
 const w=S.queue.filter(q=>q.status==='waiting').sort((a,b)=>a.num-b.num)[0];
 if(w)API.upd(w.id,{status:'in'});else toast('لا يوجد مرضى في الانتظار','✅');
}
function askFollow(id){
 const q=S.queue.find(x=>x.id===id);
 modal(`<div class="row" style="margin-bottom:10px">${ico('📅','mint',50)}<div class="grow"><h3>إنهاء كشف ${esc(q.name)}</h3><div class="mute">سجّل موعد المتابعة (اختياري)</div></div></div>
 <div class="field"><div><label>تاريخ المتابعة</label><input type="date" id="fd" value="${addDays(7)}" min="${todayStr()}"></div>
 <div><label>سعر الإعادة</label><input type="number" id="fp" value="${S.settings.followPrice}"></div></div>
 <div style="height:14px"></div>
 <button class="btn mint" onclick="finish('${id}',true)">حفظ المتابعة في التقويم وإنهاء</button>
 <div style="height:12px"></div>
 <button class="btn ghost" onclick="finish('${id}',false)">إنهاء بدون متابعة</button>`);
}
function finish(id,withF){
 const q=S.queue.find(x=>x.id===id);const patch={status:'done'};
 if(withF){
  const date=$('#fd').value;if(!date){toast('اختر التاريخ','📅');return}
  const p=+$('#fp').value||S.settings.followPrice;
  patch.followDate=date;patch.followPrice=p;
  API.addFollow({name:q.name,date,price:p,qid:id});
 }
 API.upd(id,patch);closeModal();advance();
 if(withF)toast('اتسجلت المتابعة يوم '+fmt(patch.followDate),'✅');
}
function saveSet(){
 const o={examPrice:+$('#s1').value,followPrice:+$('#s2').value,followDays:+$('#s3').value,avgMin:+$('#s4').value,clinic:$('#s5').value||S.settings.clinic,spec:$('#s6').value};
 API.saveSettings(o);toast('تم حفظ الإعدادات','💾');
}
function editF(id,k,v){
 const f=S.followups.find(x=>x.id===id);const val=k==='price'?+v:v;
 API.updFollow(id,{[k]:val});
 if(f.qid)API.upd(f.qid,k==='price'?{followPrice:val}:{followDate:val});
}
function delF(id){
 const f=S.followups.find(x=>x.id===id);
 API.delFollow(id);if(f&&f.qid)API.upd(f.qid,{followDate:null,followPrice:null});
}
function editQ(id,k,v){
 const p={[k]:v};
 if(k==='type')p.price=price(v);
 if(k==='status'&&v==='in')S.queue.filter(x=>x.status==='in'&&x.id!==id).forEach(x=>API.upd(x.id,{status:'waiting'}));
 API.upd(id,p);
}
function calMove(d){S.cal.m+=d;if(S.cal.m>11){S.cal.m=0;S.cal.y++}if(S.cal.m<0){S.cal.m=11;S.cal.y--}render()}
function ics(date,p){
 const d=date.replace(/-/g,'');
 const t=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Dawry//AR\r\nBEGIN:VEVENT\r\nUID:${d}-${Date.now()}@dawry\r\nDTSTAMP:${d}T090000Z\r\nDTSTART;VALUE=DATE:${d}\r\nSUMMARY:متابعة - ${S.settings.clinic}\r\nDESCRIPTION:سعر الإعادة ${p||S.settings.followPrice} جنيه\r\nBEGIN:VALARM\r\nTRIGGER:-P1D\r\nACTION:DISPLAY\r\nDESCRIPTION:موعد متابعتك غدًا\r\nEND:VALARM\r\nEND:VEVENT\r\nEND:VCALENDAR`;
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/calendar;charset=utf-8'}));a.download='moutabaa.ics';a.click();
 toast('تم تجهيز الموعد لتقويم الموبايل','📅');
}
async function doLogin(){
 S.loginErr='';
 try{await API.login($('#le').value.trim(),$('#lp').value)}
 catch(e){S.loginErr='البريد أو كلمة السر غير صحيحة';render()}
}
function logout(){S.role='patient';S.queue=[];S.followups=[];API.logout()}
function myFollow(){
 if(S.mine&&S.mine.followDate)return {date:S.mine.followDate,price:S.mine.followPrice};
 try{const f=JSON.parse(localStorage.getItem('dawry_follow')||'null');if(f&&f.date>=todayStr())return f}catch(_){}
 return null;
}

/* ================= مكونات ================= */
function calendar(dates){
 const {y,m}=S.cal;const first=new Date(y,m,1);const days=new Date(y,m+1,0).getDate();
 const set=new Set(dates);const today=todayStr();
 const off=(first.getDay()+1)%7; // الأسبوع يبدأ السبت

function makeDemo(){
 const D=todayStr();
 let qs=[
  {id:'d1',num:1,name:'أحمد حسن',type:'exam',status:'in',paid:true,day:D},
  {id:'d2',num:2,name:'سعاد محمود',type:'follow',status:'waiting',paid:false,day:D},
  {id:'d3',num:3,name:'مصطفى علي',type:'exam',status:'waiting',paid:false,day:D},
  {id:'d4',num:4,name:'هدى إبراهيم',type:'exam',status:'waiting',paid:false,day:D}];
 let fs=[{id:'f1',name:'نادية فؤاد',date:addDays(3),price:150},{id:'f2',name:'كريم سمير',date:addDays(6),price:150}];
 let nextNum=5,nid=10,L={};
 const live=()=>qs.filter(x=>x.status!=='cancelled');
 const emit=()=>{
  L.set&&L.set({...S.settings});L.pub&&L.pub(pubOf(live()));
  L.sq&&L.sq(qs.map(x=>({...x})));L.sf&&L.sf(fs.map(x=>({...x})));
  if(L.mine){const m=qs.find(x=>x.id===L.mine.id);L.mine.cb(m?{...m}:null)}
 };
 const add=(name,type,price)=>{const id='d'+nid++;qs.push({id,num:nextNum++,name,type,price,status:'waiting',paid:false,day:D});emit();return id};
 return{
  onAuth(cb){cb({uid:'demo',role:null})},
  watchSettings(cb){L.set=cb;cb({...S.settings})},
  watchPub(cb){L.pub=cb;cb(pubOf(live()))},
  watchMine(id,cb){L.mine=id?{id,cb}:null;if(!id)cb(null);else emit()},
  watchStaff(a,b){L.sq=a;L.sf=b;emit()},stopStaff(){L.sq=L.sf=null},
  book:async(name,type,uid,price)=>add(name,type,price),addWalk:async(name,type,uid,price)=>add(name,type,price),
  cancelMine(id){this.upd(id,{status:'cancelled'})},
  upd(id,p){const q=qs.find(x=>x.id===id);if(q){Object.assign(q,p);emit()}},
  del(id){qs=qs.filter(x=>x.id!==id);emit()},
  addFollow(o){const id='f'+nid++;fs.push({id,...o});emit();return id},
  updFollow(id,p){const f=fs.find(x=>x.id===id);if(f){Object.assign(f,p);emit()}},
  delFollow(id){fs=fs.filter(x=>x.id!==id);emit()},
  saveSettings(o){Object.assign(S.settings,o);emit()},
  syncPub(){},login:async()=>{},logout(){}
 };
}

<script type="module">
/* ================= Firebase (يعمل فقط لو أُدخلت الإعدادات) ================= */
(async()=>{
 if(!window.__LIVE)return;
 try{
  const V='10.12.2',B='https://www.gstatic.com/firebasejs/'+V+'/';
  const A=await import(B+'firebase-app.js');
  const F=await import(B+'firebase-firestore.js');
  const U=await import(B+'firebase-auth.js');
  const app=A.initializeApp(window.DAWRY_CONFIG);
  let db;
  const DBID=window.DAWRY_DB||undefined;
  try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})},DBID)}
  catch(_){db=DBID?F.getFirestore(app,DBID):F.getFirestore(app)}
  const auth=U.getAuth(app);
  const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
  const un={};const stop=k=>{if(un[k]){un[k]();delete un[k]}};
  const docs=s=>s.docs.map(d=>({id:d.id,...d.data()}));
  let lastPub='';
  async function take(name,type,uid,price){
   const cref=F.doc(db,'counters','main'),qref=F.doc(F.collection(db,'queue')),day=today();
   await F.runTransaction(db,async tx=>{
    const c=await tx.get(cref);
    const num=(c.exists()&&c.data().date===day)?c.data().next:1;
    tx.set(cref,{date:day,next:num+1});
    tx.set(qref,{uid,name,type,price,status:'waiting',paid:false,num,day,createdAt:Date.now(),followDate:null,followPrice:null});
   });
   return qref.id;
  }
  const api={
   onAuth(cb){
    U.onAuthStateChanged(auth,async u=>{
     if(!u){try{await U.signInAnonymously(auth)}catch(e){cb({uid:null,role:null,error:'anon'})}return}
     let role=null;
     if(!u.isAnonymous){
      try{const s=await F.getDoc(F.doc(db,'users',u.uid));role=s.exists()?s.data().role:null}catch(_){}
      if(role!=='admin'&&role!=='sec'){cb({noRole:true});return}
     }
     cb({uid:u.uid,role,email:u.email||''});
    });
   },
   watchSettings(cb){F.onSnapshot(F.doc(db,'settings','main'),s=>{if(s.exists())cb(s.data())},()=>{})},
   watchPub(cb){F.onSnapshot(F.doc(db,'public','status'),s=>cb(s.exists()?s.data():{inNum:null,waiting:[]}),()=>{})},
   watchMine(id,cb){stop('mine');if(!id){cb(null);return}
    un.mine=F.onSnapshot(F.doc(db,'queue',id),s=>cb(s.exists()?{id:s.id,...s.data()}:null),()=>{localStorage.removeItem('dawry_my');cb(null)})},
   watchStaff(cq,cf){stop('sq');stop('sf');
    un.sq=F.onSnapshot(F.query(F.collection(db,'queue'),F.where('day','==',today())),s=>cq(docs(s)),e=>console.error(e));
    un.sf=F.onSnapshot(F.collection(db,'followups'),s=>cf(docs(s)),e=>console.error(e))},
   stopStaff(){stop('sq');stop('sf')},
   book:(name,type,uid,price)=>take(name,type,uid,price),
   addWalk:(name,type,uid,price)=>take(name,type,uid,price),
   cancelMine:id=>F.updateDoc(F.doc(db,'queue',id),{status:'cancelled'}),
   upd:(id,p)=>F.updateDoc(F.doc(db,'queue',id),p),
   del:id=>F.deleteDoc(F.doc(db,'queue',id)),
   addFollow:async o=>(await F.addDoc(F.collection(db,'followups'),o)).id,
   updFollow:(id,p)=>F.updateDoc(F.doc(db,'followups',id),p),
   delFollow:id=>F.deleteDoc(F.doc(db,'followups',id)),
   saveSettings:o=>F.setDoc(F.doc(db,'settings','main'),o,{merge:true}),
   syncPub(p){const k=JSON.stringify(p);if(k===lastPub)return;lastPub=k;F.setDoc(F.doc(db,'public','status'),p).catch(()=>{lastPub=''})},
   login:(e,p)=>U.signInWithEmailAndPassword(auth,e,p),
   logout:()=>U.signOut(auth)
  };
  window.dispatchEvent(new CustomEvent('fbready',{detail:api}));
 }catch(e){console.error(e);window.dispatchEvent(new Event('fberror'))}
})();
</script>
</body>
</html>
